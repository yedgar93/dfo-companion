name: Clean up old workflow runs
on:
  workflow_run:
    workflows: ['Build and release desktop apps']
    types: [completed]
permissions: {}
concurrency:
  group: cleanup-runs
  cancel-in-progress: false
jobs:
  cleanup:
    # Only after main pushes, never PR runs; never blocks or fails a release.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old runs, keeping the newest five release-workflow runs and release commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: '5'
        shell: bash
        run: |
          set -euo pipefail
          # Commits of published (non-draft) releases' tags.
          gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft == false) | .tag_name' > tags.txt
          : > keep-shas.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            sha=$(gh api "repos/$REPO/commits/$tag" --jq '.sha' 2>/dev/null || true)
            [ -n "$sha" ] && echo "$sha" >> keep-shas.txt
          done < tags.txt
          # The release workflow's id, resolved from its file so a rename of its display name cannot widen the count.
          release_id=$(gh api "repos/$REPO/actions/workflows/release.yml" --jq '.id')
          gh api --paginate "repos/$REPO/actions/workflows/$release_id/runs?per_page=100" --jq '.workflow_runs[].id' > release-runs.txt
          head -n "$KEEP" release-runs.txt > keep-release.txt
          # All runs, newest first: id, status, head_sha. The newest $KEEP overall are kept too.
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id, .status, .head_sha] | @tsv' > runs.tsv
          n=0; deleted=0
          while IFS=$'\t' read -r id status sha; do
            n=$((n+1))
            [ "$n" -le "$KEEP" ] && continue
            [ "$status" = "completed" ] || continue
            grep -qxF "$id" keep-release.txt && continue
            grep -qxF "$sha" keep-shas.txt && continue
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null; then deleted=$((deleted+1)); else echo "::warning::Could not delete run $id"; fi
          done < runs.tsv
          echo "Kept newest $KEEP release-workflow runs, newest $KEEP overall, and $(sort -u keep-shas.txt | wc -l) release commits; deleted $deleted runs."
